<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agua Cristal · Pedidos</title>
<link rel="stylesheet" href="estilos.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<section id="login">
  <img src="mascota.png" alt="" onerror="this.style.display='none'">
  <h1>Agua Cristal</h1>
  <input id="em" type="email" placeholder="Correo">
  <input id="pw" type="password" placeholder="Contraseña">
  <button id="btnLogin" class="btn">Entrar</button>
  <p id="err"></p>
</section>

<main id="app" hidden>
  <header>
    <img src="logo.png" alt="Agua Cristal" onerror="this.style.display='none'">
    <span id="quien"></span>
    <button id="btnSalir">Salir</button>
  </header>

  <section id="t-pedido" class="tab">
    <div class="seg">
      <button id="bDom" class="on">Domicilio</button>
      <button id="bLoc">Local</button>
    </div>

    <div id="datos">
      <input id="tel" inputmode="numeric" maxlength="8" placeholder="Teléfono (8 dígitos)">
      <p id="estado"></p>
      <input id="nombre" placeholder="Nombre (opcional)">
      <input id="apellido" placeholder="Apellido (opcional)">
      <select id="dirSel"></select>
      <input id="dirNueva" placeholder="Dirección">
      <input id="tel2" inputmode="numeric" maxlength="8" placeholder="Teléfono opcional">
    </div>

    <div id="marcas"></div>
    <div class="total"><span id="totTxt"></span><button id="btnGuardar" class="btn">Guardar pedido</button></div>
  </section>

  <section id="t-ventas" class="tab" hidden>
    <div class="fila">
      <input type="date" id="dia">
      <button id="btnExcel" class="btn solo-maestro">Descargar Excel</button>
    </div>
    <div id="resumen"></div>
    <div id="lista"></div>
  </section>

  <section id="t-metas" class="tab" hidden>
    <div id="metaHoy"></div>
    <div id="metaSem"></div>
    <div id="editMetas" class="solo-maestro">
      <p>Meta diaria (garrafones)</p>
      <div id="inputsMeta"></div>
      <button id="btnMetas" class="btn">Guardar metas</button>
    </div>
  </section>

  <section id="t-admin" class="tab" hidden>
    <div id="resAdmin"></div>
    <div class="card"><h3>Registrar gasto</h3>
      <select id="gTipo"><option value="compra">Compra de inventario</option><option value="imprevisto">Imprevisto u otro gasto</option></select>
      <select id="gItem"></select>
      <input id="gCant" type="number" step="any" placeholder="Cantidad comprada">
      <input id="gConc" placeholder="Concepto (ej. pipa, reparación moto)">
      <input id="gMonto" type="number" step="any" placeholder="Monto Q">
      <button id="btnGasto" class="btn">Guardar gasto</button></div>
    <div class="card"><h3>Inventario</h3><div id="invLista"></div><button id="btnNuevoItem" class="btn">+ Nuevo insumo</button></div>
    <div class="card"><h3>Gastos del mes</h3><div id="gastosLista"></div></div>
  </section>

  <nav>
    <button data-t="pedido" class="on">Pedido</button>
    <button data-t="ventas">Ventas</button>
    <button data-t="metas">Metas</button>
    <button data-t="admin" class="solo-maestro">Admin</button>
  </nav>
</main>

<div id="ticket"></div>
<script type="module" src="app.js"></script>
</body>
</html>
