<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agua Cristal · Pedidos</title>
<link rel="stylesheet" href="estilos.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<section id="login">
  <img src="mascota.png" alt="" onerror="this.style.display='none'">
  <h1>Agua Cristal</h1>
  <input id="em" type="email" placeholder="Correo">
  <input id="pw" type="password" placeholder="Contraseña">
  <button id="btnLogin" class="btn">Entrar</button>
  <p id="err"></p>
</section>

<main id="app" hidden>
  <header>
    <img src="logo.png" alt="Agua Cristal" onerror="this.style.display='none'">
    <span id="quien"></span>
    <button id="btnSalir">Salir</button>
  </header>

  <section id="t-pedido" class="tab">
    <div class="seg">
      <button id="bDom" class="on">Domicilio</button>
      <button id="bLoc">Local</button>
    </div>

    <div id="datos">
      <input id="tel" inputmode="numeric" maxlength="8" placeholder="Teléfono (8 dígitos)">
      <p id="estado"></p>
      <input id="nombre" placeholder="Nombre (opcional)">
      <input id="apellido" placeholder="Apellido (opcional)">
      <select id="dirSel"></select>
      <input id="dirNueva" placeholder="Dirección">
      <input id="tel2" inputmode="numeric" maxlength="8" placeholder="Teléfono opcional">
    </div>

    <div id="marcas"></div>
    <div class="total"><span id="totTxt"></span><button id="btnGuardar" class="btn">Guardar pedido</button></div>
  </section>

  <section id="t-ventas" class="tab" hidden>
    <div class="fila">
      <input type="date" id="dia">
      <button id="btnExcel" class="btn solo-maestro">Descargar Excel</button>
    </div>
    <div id="resumen"></div>
    <div id="stockBox"></div>
    <div id="lista"></div>
  </section>

  <section id="t-metas" class="tab" hidden>
    <div id="metaHoy"></div>
    <div id="metaSem"></div>
    <div id="editMetas" class="solo-maestro">
      <p>Meta diaria (garrafones)</p>
      <div id="inputsMeta"></div>
      <button id="btnMetas" class="btn">Guardar metas</button>
    </div>
  </section>

  <section id="t-gastos" class="tab" hidden>
    <div class="fila"><button id="btnExp" class="btn">Exportar Excel (hojas 4 a 7)</button><button id="btnPlus" class="btn">+ Concepto</button><button id="btnImp" class="btn">Importar histórico</button></div>
    <div id="gastosTabla" class="scroll"></div>
  </section>

  <section id="t-semanas" class="tab" hidden>
    <select id="semSel"></select>
    <div id="semDet"></div>
  </section>

  <section id="t-pend" class="tab" hidden>
    <input type="month" id="pendMes">
    <div id="pendDet"></div>
  </section>

  <section id="t-registro" class="tab" hidden>
    <div class="card"><h3>Registrar pago o compra</h3>
      <input type="date" id="rFecha">
      <select id="rSel"></select>
      <input id="rConc" placeholder="Concepto (ej. reparación de tubería)" hidden>
      <input id="rMonto" type="number" step="any" placeholder="Monto Q">
      <div id="rTapDiv" hidden><input id="rTap" type="number" placeholder="Tapones comprados"><input id="rSello" type="number" placeholder="Sellos comprados"></div>
      <button id="btnReg" class="btn">Guardar</button></div>
    <div class="card"><h3>Pagos del mes</h3><div id="regLista"></div></div>
  </section>

  <nav>
    <button data-t="pedido" class="on">Ventas</button>
    <button data-t="ventas">Resumen</button>
    <button data-t="metas">Metas</button>
    <button data-t="gastos" class="solo-maestro">Gastos</button>
    <button data-t="semanas" class="solo-maestro">Semanas</button>
    <button data-t="pend" class="solo-maestro">Pendientes</button>
    <button data-t="registro" class="solo-maestro">Registrar</button>
  </nav>
</main>

<div id="ticket"></div>
<script type="module" src="app.js"></script>
</body>
</html>
