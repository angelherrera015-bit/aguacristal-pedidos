<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Importar clientes</title>
<style>
body{font:16px system-ui,sans-serif;padding:16px;max-width:520px;margin:auto;background:#EAF6FD;color:#12324F}
input,button{font:inherit;width:100%;padding:12px;margin:5px 0;border-radius:10px;border:2px solid #b9dcf2;box-sizing:border-box}
button{background:#F28C1E;color:#fff;border:0;font-weight:700}
[hidden]{display:none}
</style>
</head>
<body>
<h2>Importar clientes</h2>
<div id="lg">
  <input id="em" type="email" placeholder="Correo del maestro">
  <input id="pw" type="password" placeholder="Contraseña">
  <button id="bl">Entrar</button>
</div>
<div id="im" hidden>
  <p id="info"></p>
  <button id="bi">Importar clientes</button>
</div>
<p id="msg"></p>

import {getFirestore,doc,getDoc,setDoc,arrayUnion} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({

  storageBucket: "agua-cristal06.firebasestorage.app",
  messagingSenderId: "600517753248",
  appId: "1:600517753248:web:f1c444619e5a08f1354cc5"

const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);

const DATOS = `

// Agrupa por teléfono y quita direcciones repetidas
const clientes = new Map();
for (const l of DATOS) {
  const [tel, dir] = l.split("|");
  if (!/^\d{8}$/.test(tel) || !dir) continue;
  if (!clientes.has(tel)) clientes.set(tel, new Map());
  clientes.get(tel).set(dir.toLowerCase().replace(/\s+/g, " ").trim(), dir.trim());
}
const totalDir = [...clientes.values()].reduce((a, m) => a + m.size, 0);

$("bl").onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
  catch { $("msg").textContent = "Correo o contraseña incorrectos."; }
};
onAuthStateChanged(auth, async u => {
  if (!u) return;
  const s = await getDoc(doc(db, "usuarios", u.uid));
  if (!s.exists() || s.data().rol !== "maestro") { $("msg").textContent = "Solo el usuario maestro puede importar."; return; }
  $("lg").hidden = true; $("im").hidden = false; $("msg").textContent = "";
  $("info").textContent = `Listos para importar: ${clientes.size} clientes con ${totalDir} direcciones.`;
});
$("bi").onclick = async () => {
  $("bi").disabled = true; let n = 0;
  try {
    for (const [tel, dirs] of clientes) {
      await setDoc(doc(db, "clientes", tel), {direcciones: arrayUnion(...dirs.values())}, {merge: true});
      $("msg").textContent = `Importando ${++n} de ${clientes.size}…`;
    }
    $("msg").textContent = `Listo: ${n} clientes importados. Ya puedes borrar importar.html del repositorio.`;
  } catch (e) { $("msg").textContent = "Error: " + e.message; $("bi").disabled = false; }
};
</script>
